aid: webai
name: webAI
description: >-
  webAI is a sovereign AI platform for building, owning, and connecting
  specialized intelligence that runs where your data lives. Instead of sending
  sensitive data to a centralized cloud, webAI lets organizations create and
  deploy custom AI models on their own local infrastructure with local
  orchestration, keeping data in place to reduce risk, lower latency, and make
  costs predictable across healthcare, manufacturing, finance, aviation, public
  sector, and retail. The platform spans Companion, Navigator, Runtime,
  webFrame, Network, and a CLI, and its first shipping product is a macOS
  desktop app for Apple Silicon Macs offering on-device Chat, Personas,
  Messages, Contacts, and Artifacts that can run fully offline.
